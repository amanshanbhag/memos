[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memos"
version = "0.1.0"
description = "Benchmark suite, memory roofline model, and scheduling toolkit for AI inference memory systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "matplotlib",
    "numpy",
    "rich",
    "click",
    "jinja2",
    # vLLM's `bench serve` lazily imports pandas to load the `custom` dataset
    # (our zipf/skewed-reuse workload). The stock vllm:26.05 container omits it,
    # so declare it here -> the sbatch's `pip install -e` pulls it in-container.
    "pandas",
    # `memos recommend` / model_profile build a ModelProfile from a HF
    # config.json via transformers.AutoConfig (config only, no torch/weights).
    # Needed on the bare login-node venv, where vLLM (which vendors it) is absent.
    "transformers",
]

[project.optional-dependencies]
vllm = ["vllm"]

[project.scripts]
memos = "memos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memos"]
artifacts = ["src/memos/manifests/*.j2"]